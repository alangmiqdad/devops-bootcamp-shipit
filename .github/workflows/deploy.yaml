name: deploy
on: [push, workflow_dispatch]
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 6
      - run: echo "Ship it!"
  say-hello-world:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 7
      - run: echo "sixseven"
  update:
    runs-on: ubuntu-latest
    steps:
      - run: apt update -y
      - run: echo "sixseven"
  done-update:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 7
      - run: echo "done"